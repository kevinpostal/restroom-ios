name: Restroom
options:
  bundleIdPrefix: com.kevinpostal
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YEJTMUK9M4
targets:
  Restroom:
    type: application
    platform: iOS
    sources: [Restroom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinpostal.restroom
        INFOPLIST_FILE: Restroom/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Restroom/Info.plist
      properties:
        CFBundleDisplayName: Restroom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Restroom uses your location to find restrooms nearby."
  RestroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RestroomTests]
    settings:
      base:
        INFOPLIST_FILE: RestroomTests/Info.plist
    info:
      path: RestroomTests/Info.plist
      properties: {}
    dependencies: [{ target: Restroom }]
  RestroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RestroomUITests]
    settings:
      base:
        INFOPLIST_FILE: RestroomUITests/Info.plist
        TEST_TARGET_NAME: Restroom
    info:
      path: RestroomUITests/Info.plist
      properties: {}
    dependencies: [{ target: Restroom }]
schemes:
  Restroom:
    build: { targets: { Restroom: all, RestroomTests: [test], RestroomUITests: [test] } }
    run: { config: Debug }
    test: { config: Debug, targets: [RestroomTests, RestroomUITests] }
